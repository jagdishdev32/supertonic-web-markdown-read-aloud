<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Library — Read Aloud</title>
<style>
:root{color-scheme:light dark;}
*{box-sizing:border-box;}
body{margin:0;min-height:100vh;background:Canvas;color:CanvasText;font:14px/1.5 Inter,system-ui,-apple-system,sans-serif;}
.wrap{max-width:960px;margin:0 auto;padding:28px 20px 60px;}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
h1{font-size:22px;margin:0;font-weight:600;}
.spacer{flex:1;}
button,.btn{padding:7px 14px;border-radius:8px;border:1px solid rgba(128,128,128,.45);background:Canvas;color:CanvasText;font:600 13px Inter,system-ui,sans-serif;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
button.primary{background:Highlight;color:HighlightText;border-color:transparent;}
button:hover,.btn:hover{border-color:Highlight;}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid rgba(128,128,128,.4);}
.chip.ok{color:#2e7d32;border-color:#2e7d32;}
.chip.bad{color:#c0392b;border-color:#c0392b;}
.stats{opacity:.65;font-size:13px;margin:0 0 14px;}
input[type=search]{padding:8px 12px;border:1px solid rgba(128,128,128,.45);border-radius:8px;background:Canvas;color:CanvasText;font:13px Inter,system-ui,sans-serif;width:260px;}
table{width:100%;border-collapse:collapse;margin-top:14px;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;opacity:.6;padding:8px 10px;border-bottom:1px solid rgba(128,128,128,.3);}
td{padding:9px 10px;border-bottom:1px solid rgba(128,128,128,.18);}
tr:hover td{background:color-mix(in srgb, CanvasText 5%, transparent);}
td.nm{font-weight:500;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;}
td.nm:hover{color:Highlight;}
td.nm input{width:100%;padding:4px 8px;border:1px solid rgba(128,128,128,.5);border-radius:6px;background:Canvas;color:CanvasText;font:14px Inter,sans-serif;}
td.dim{opacity:.65;font-size:12.5px;white-space:nowrap;}
td.ops{white-space:nowrap;text-align:right;}
td.ops button{padding:4px 10px;font-size:12px;margin-left:6px;}
.cur{font-size:11px;opacity:.6;font-weight:400;}
.empty{opacity:.65;padding:40px 0;text-align:center;}
.actions button.danger:hover{border-color:#c0392b;color:#c0392b;}
a.plain{color:inherit;text-decoration:none;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Library</h1>
    <span class="chip" id="engine-chip">…</span>
    <span class="spacer"></span>
    <button id="new-doc" class="primary">＋ New document</button>
    <a class="btn" href="/">Open reader</a>
    <button id="refresh" title="Reload list">⟳</button>
  </header>
  <p class="stats" id="stats"></p>
  <input type="search" id="filter" placeholder="Filter by name…" />
  <table>
    <thead><tr><th>Name</th><th>Modified</th><th>Created</th><th>Size</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" hidden>No documents yet — paste markdown in the <a class="plain" href="/">reader</a>, or click “New document”.</div>
</div>
<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  let docs = [];

  const humanBytes = (n) => (n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(1) + ' MB');

  async function refresh() {
    const [lib, state] = await Promise.all([
      fetch('/api/library').then((r) => r.json()),
      fetch('/api/state').then((r) => r.json()).catch(() => null),
    ]);
    docs = lib.docs;

    const chip = $('engine-chip');
    if (state) {
      const ok = state.supertonicOk && state.settings.engine === 'supertonic';
      chip.textContent = state.settings.engine === 'supertonic'
        ? (state.supertonicOk ? 'Supertonic: running' : 'Supertonic: not reachable')
        : 'Engine: ' + state.settings.engine;
      chip.className = 'chip ' + (state.settings.engine === 'supertonic' && !state.supertonicOk ? 'bad' : 'ok');
      chip.title = state.healthError || '';
    }
    const total = docs.reduce((s, d) => s + (d.bytes || 0), 0);
    $('stats').textContent = docs.length + (docs.length === 1 ? ' document' : ' documents') + ' · ' + humanBytes(total);

    render();
  }

  function render() {
    const q = $('filter').value.trim().toLowerCase();
    const rows = docs.filter((d) => !q || d.name.toLowerCase().includes(q));
    $('empty').hidden = docs.length > 0;
    $('rows').innerHTML = rows.map((d) => `
      <tr data-id="${d.id}">
        <td class="nm" title="${d.file.replace(/"/g, '&quot;')} — click to open in the reader">${d.name.replace(/</g, '&lt;')}${d.id === (window.__cur || '') ? '<div class="cur">currently open</div>' : ''}</td>
        <td class="dim">${new Date(d.openedAt).toLocaleString()}</td>
        <td class="dim">${new Date(d.addedAt).toLocaleDateString()}</td>
        <td class="dim">${humanBytes(d.bytes || 0)}</td>
        <td class="ops actions">
          <button data-open="${d.id}" class="primary" title="Open in the reader">▶ Open</button>
          <button data-ren="${d.id}" data-name="${d.name.replace(/"/g, '&quot;')}" title="Rename">✎</button>
          <a class="btn" href="/api/library/file/${d.id}" download="${d.file.replace(/"/g, '')}" title="Download .md">↓</a>
          <button class="danger" data-del="${d.id}" title="Delete file">×</button>
        </td>
      </tr>`).join('');
    bind();
  }

  function bind() {
    document.querySelectorAll('td.nm').forEach((el) => (el.onclick = () => openDoc(el.parentElement.dataset.id)));
    document.querySelectorAll('[data-open]').forEach((el) => (el.onclick = () => openDoc(el.dataset.open)));
    document.querySelectorAll('[data-del]').forEach((el) =>
      (el.onclick = async () => {
        if (!confirm('Delete this document file from disk?')) return;
        const res = await fetch('/api/library/' + el.dataset.del, { method: 'DELETE' });
        if (!res.ok) alert('Delete failed');
        refresh();
      }));
    document.querySelectorAll('[data-ren]').forEach((el) =>
      (el.onclick = () => {
        const td = el.closest('tr').querySelector('.nm');
        const old = el.dataset.name;
        td.innerHTML = `<input value="${old.replace(/"/g, '&quot;')}" />`;
        const input = td.querySelector('input');
        input.focus();
        input.select();
        let done = false;
        const commit = async () => {
          if (done) return;
          done = true;
          const name = input.value.trim();
          if (name && name !== old) {
            const res = await fetch('/api/library/rename', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ id: el.dataset.id, name }),
            });
            if (!res.ok) alert((await res.json().catch(() => ({}))).message || 'Rename failed');
          }
          refresh();
        };
        input.onkeydown = (e) => {
          if (e.key === 'Enter') commit();
          if (e.key === 'Escape') { done = true; refresh(); }
        };
        input.onblur = commit;
      }));
  }

  async function openDoc(id) {
    const res = await fetch('/api/library/open', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id }),
    });
    if (!res.ok) {
      alert((await res.json().catch(() => ({}))).message || 'Could not open document');
      return;
    }
    location.href = '/'; // the reader boots straight into this document
  }

  $('new-doc').onclick = async () => {
    await fetch('/api/settings', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ currentDocId: null, currentSource: '' }),
    });
    location.href = '/';
  };
  $('refresh').onclick = refresh;
  $('filter').oninput = render;

  fetch('/api/state').then((r) => r.json()).then((s) => { window.__cur = s.settings.currentDocId || ''; }).then(refresh).catch(refresh);
})();
</script>
</body>
</html>
